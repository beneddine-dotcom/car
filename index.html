<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>كاشف السيارات - YOLO في المتصفح مع تكبير الكاميرا</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0f2a, #0a1a3a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            max-width: 1100px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(0,180,216,0.3);
        }

        h1 {
            text-align: center;
            color: #00b4d8;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stat-card {
            background: rgba(0,0,0,0.5);
            border-radius: 15px;
            padding: 10px 15px;
            text-align: center;
            border: 1px solid #00b4d8;
            flex: 1;
            min-width: 80px;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00e5ff;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #ccd6f6;
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            cursor: zoom-in;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: auto;
            overflow: hidden;
            border-radius: 15px;
        }

        video, canvas {
            width: 100%;
            border-radius: 15px;
            transition: transform 0.3s ease;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
        }

        .zoom-btn {
            background: #00b4d8;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .zoom-btn:hover {
            transform: scale(1.1);
            background: #0096c7;
        }

        .zoom-btn:active {
            transform: scale(0.95);
        }

        .zoom-level {
            color: white;
            font-size: 12px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,180,216,0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff3b30, #d32f2f);
        }

        .btn-success {
            background: linear-gradient(135deg, #00c853, #00e676);
        }

        .btn-warning {
            background: linear-gradient(135deg, #ff9800, #f57c00);
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #00b4d8;
        }

        .detection-list {
            background: rgba(0,0,0,0.5);
            border-radius: 15px;
            padding: 15px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }

        .detection-item {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .detection-class {
            color: #00e5ff;
            font-weight: bold;
        }

        .detection-confidence {
            color: #00c853;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a2a4a;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #00b4d8;
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            .stat-number {
                font-size: 1.2rem;
            }
            .zoom-btn {
                width: 35px;
                height: 35px;
                font-size: 18px;
            }
        }

        .camera-select {
            background: rgba(0,0,0,0.5);
            border: 1px solid #00b4d8;
            color: white;
            padding: 8px 12px;
            border-radius: 10px;
            margin-right: 10px;
            font-family: inherit;
        }

        .zoom-reset {
            background: #ff9800;
        }

        .zoom-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 10;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🚗 كاشف السيارات والمركبات - مع تكبير الكاميرا 📷</h1>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" id="carCount">0</div>
            <div class="stat-label">🚗 سيارات</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="truckCount">0</div>
            <div class="stat-label">🚛 شاحنات</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalCount">0</div>
            <div class="stat-label">📦 الإجمالي</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="fpsCount">0</div>
            <div class="stat-label">⚡ FPS</div>
        </div>
    </div>

    <div class="video-container" id="videoContainer">
        <div class="video-wrapper" id="videoWrapper">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas"></canvas>
        </div>
        <div class="zoom-controls">
            <button class="zoom-btn" id="zoomOut" title="تصغير">-</button>
            <span class="zoom-level" id="zoomLevel">100%</span>
            <button class="zoom-btn" id="zoomIn" title="تكبير">+</button>
            <button class="zoom-btn zoom-reset" id="zoomReset" title="إعادة ضبط التكبير">⟳</button>
        </div>
        <div class="zoom-indicator" id="zoomIndicator">🔍 مستوى التكبير: 1x</div>
    </div>

    <div class="controls">
        <select id="cameraSelect" class="camera-select" style="display: none;">
            <option value="">اختر الكاميرا...</option>
        </select>
        <button id="startCamera" class="btn-success">📷 تشغيل الكاميرا</button>
        <button id="switchCamera" style="display: none;">🔄 تبديل الكاميرا</button>
        <button id="uploadVideo" class="btn-primary">🎥 رفع فيديو</button>
        <button id="stopDetection" class="btn-danger" disabled>⏹️ إيقاف</button>
        <input type="file" id="videoInput" accept="video/mp4,video/webm" style="display: none;">
    </div>

    <div class="detection-list" id="detectionList">
        <div class="loading">⏳ انتظر تحميل النموذج...</div>
    </div>
</div>

<!-- TensorFlow.js والمكتبات -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<script>
    // المتغيرات العامة
    let model = null;
    let currentStream = null;
    let animationId = null;
    let videoElement = document.getElementById('video');
    let canvas = document.getElementById('canvas');
    let ctx = canvas.getContext('2d');
    let isDetecting = false;
    let lastTimestamp = 0;
    let frameCount = 0;
    let fps = 0;
    let currentFacingMode = 'environment';
    
    // متغيرات التكبير
    let currentZoom = 1;
    const minZoom = 1;
    const maxZoom = 4;
    let zoomStep = 0.25;
    
    // عناصر DOM
    const carCountEl = document.getElementById('carCount');
    const truckCountEl = document.getElementById('truckCount');
    const totalCountEl = document.getElementById('totalCount');
    const fpsCountEl = document.getElementById('fpsCount');
    const detectionListEl = document.getElementById('detectionList');
    const startCameraBtn = document.getElementById('startCamera');
    const switchCameraBtn = document.getElementById('switchCamera');
    const uploadVideoBtn = document.getElementById('uploadVideo');
    const stopDetectionBtn = document.getElementById('stopDetection');
    const videoInput = document.getElementById('videoInput');
    const cameraSelect = document.getElementById('cameraSelect');
    const videoWrapper = document.getElementById('videoWrapper');
    const zoomLevelSpan = document.getElementById('zoomLevel');
    const zoomIndicator = document.getElementById('zoomIndicator');
    const zoomInBtn = document.getElementById('zoomIn');
    const zoomOutBtn = document.getElementById('zoomOut');
    const zoomResetBtn = document.getElementById('zoomReset');

    let availableCameras = [];

    // ==========================================
    // وظائف التكبير والتصغير
    // ==========================================
    function updateZoom() {
        const zoomPercent = Math.round(currentZoom * 100);
        zoomLevelSpan.textContent = `${zoomPercent}%`;
        zoomIndicator.textContent = `🔍 مستوى التكبير: ${currentZoom.toFixed(2)}x`;
        
        // تطبيق التكبير على الفيديو والكانفس
        if (videoElement && canvas) {
            videoElement.style.transform = `scale(${currentZoom})`;
            canvas.style.transform = `scale(${currentZoom})`;
            
            // ضبط origin للتكبير من المركز
            videoElement.style.transformOrigin = 'center center';
            canvas.style.transformOrigin = 'center center';
        }
    }
    
    function zoomIn() {
        if (currentZoom + zoomStep <= maxZoom) {
            currentZoom += zoomStep;
            updateZoom();
        } else {
            // اهتزاز بسيط للإشارة إلى الوصول للحد الأقصى
            const container = document.getElementById('videoContainer');
            container.style.transform = 'scale(1.02)';
            setTimeout(() => { container.style.transform = 'scale(1)'; }, 200);
        }
    }
    
    function zoomOut() {
        if (currentZoom - zoomStep >= minZoom) {
            currentZoom -= zoomStep;
            updateZoom();
        }
    }
    
    function resetZoom() {
        currentZoom = 1;
        updateZoom();
    }
    
    // التكبير باستخدام عجلة الماوس
    function handleWheelZoom(e) {
        if (!isDetecting) return;
        
        e.preventDefault();
        if (e.deltaY < 0) {
            // تمرير لأعلى = تكبير
            if (currentZoom + zoomStep <= maxZoom) {
                currentZoom += zoomStep;
                updateZoom();
            }
        } else {
            // تمرير لأسفل = تصغير
            if (currentZoom - zoomStep >= minZoom) {
                currentZoom -= zoomStep;
                updateZoom();
            }
        }
    }
    
    // تكبير بالنقر المزدوج
    function handleDoubleClickZoom(e) {
        e.preventDefault();
        if (currentZoom === maxZoom) {
            resetZoom();
        } else {
            // تكبير سريع إلى أقصى حد
            currentZoom = maxZoom;
            updateZoom();
        }
    }

    // ==========================================
    // الحصول على قائمة الكاميرات
    // ==========================================
    async function getAvailableCameras() {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(device => device.kind === 'videoinput');
            availableCameras = videoDevices;
            
            if (videoDevices.length > 1) {
                cameraSelect.style.display = 'inline-block';
                switchCameraBtn.style.display = 'inline-block';
                
                cameraSelect.innerHTML = '<option value="">اختر الكاميرا...</option>';
                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.textContent = device.label || `كاميرا ${index + 1}`;
                    cameraSelect.appendChild(option);
                });
            }
            
            return videoDevices;
        } catch (error) {
            console.error('خطأ في الحصول على الكاميرات:', error);
            return [];
        }
    }

    // ==========================================
    // بدء الكاميرا
    // ==========================================
    async function startCamera(facingMode = 'environment') {
        if (!model) {
            alert('الرجاء الانتظار حتى يتم تحميل النموذج');
            return;
        }

        try {
            if (currentStream) {
                stopDetection();
            }

            // إعادة ضبط التكبير عند بدء كاميرا جديدة
            resetZoom();

            const constraints = {
                video: {
                    facingMode: { exact: facingMode }
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            } catch (err) {
                console.warn('فشل في تحديد الكاميرا بالضبط:', err);
                currentStream = await navigator.mediaDevices.getUserMedia({ video: true });
            }
            
            videoElement.srcObject = currentStream;
            await videoElement.play();
            
            if (facingMode === 'user') {
                videoElement.style.transform = `scaleX(-1) scale(${currentZoom})`;
                canvas.style.transform = `scaleX(-1) scale(${currentZoom})`;
            } else {
                videoElement.style.transform = `scale(${currentZoom})`;
                canvas.style.transform = `scale(${currentZoom})`;
            }
            videoElement.style.transformOrigin = 'center center';
            canvas.style.transformOrigin = 'center center';
            
            isDetecting = true;
            stopDetectionBtn.disabled = false;
            startCameraBtn.disabled = true;
            uploadVideoBtn.disabled = true;
            switchCameraBtn.disabled = false;
            
            frameCount = 0;
            lastTimestamp = performance.now();
            detectFrame();
            
        } catch (error) {
            console.error('خطأ في الوصول إلى الكاميرا:', error);
            let errorMsg = 'لا يمكن الوصول إلى الكاميرا. ';
            if (error.name === 'OverconstrainedError') {
                errorMsg += 'الكاميرا المطلوبة غير متوفرة على هذا الجهاز.';
            } else {
                errorMsg += 'تأكد من منح الأذونات.';
            }
            alert(errorMsg);
            
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ video: true });
                videoElement.srcObject = currentStream;
                await videoElement.play();
                resetZoom();
                isDetecting = true;
                stopDetectionBtn.disabled = false;
                startCameraBtn.disabled = true;
                detectFrame();
            } catch (fallbackError) {
                console.error('فشل أيضاً:', fallbackError);
            }
        }
    }

    // ==========================================
    // تبديل الكاميرا
    // ==========================================
    async function switchCamera() {
        resetZoom();
        if (currentFacingMode === 'environment') {
            currentFacingMode = 'user';
            await startCamera('user');
        } else {
            currentFacingMode = 'environment';
            await startCamera('environment');
        }
    }

    // ==========================================
    // بدء كاميرا محددة
    // ==========================================
    async function startSpecificCamera(deviceId) {
        if (!model) {
            alert('الرجاء الانتظار حتى يتم تحميل النموذج');
            return;
        }

        try {
            if (currentStream) {
                stopDetection();
            }

            resetZoom();
            
            const constraints = {
                video: { deviceId: { exact: deviceId } }
            };

            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            videoElement.srcObject = currentStream;
            await videoElement.play();
            
            isDetecting = true;
            stopDetectionBtn.disabled = false;
            startCameraBtn.disabled = true;
            uploadVideoBtn.disabled = true;
            
            frameCount = 0;
            lastTimestamp = performance.now();
            detectFrame();
            
        } catch (error) {
            console.error('خطأ:', error);
            alert('لا يمكن الوصول إلى الكاميرا المحددة');
        }
    }

    // ==========================================
    // تحميل النموذج
    // ==========================================
    async function loadModel() {
        detectionListEl.innerHTML = '<div class="loading">📥 جاري تحميل نموذج الكشف... (قد يستغرق 10-20 ثانية)</div>';
        try {
            model = await cocoSsd.load();
            detectionListEl.innerHTML = '<div class="loading">✅ النموذج جاهز! اضغط على "تشغيل الكاميرا" أو اختر فيديو<br>💡 نصيحة: استخدم عجلة الماوس للتكبير/التصغير أو اضغط على الأزرار</div>';
            console.log('✅ نموذج COCO-SSD تم تحميله بنجاح');
            await getAvailableCameras();
        } catch (error) {
            detectionListEl.innerHTML = `<div class="loading">❌ خطأ في تحميل النموذج: ${error.message}</div>`;
            console.error('خطأ في تحميل النموذج:', error);
        }
    }

    // ==========================================
    // كشف الإطارات
    // ==========================================
    async function detectFrame() {
        if (!isDetecting || !videoElement.videoWidth) {
            requestAnimationFrame(detectFrame);
            return;
        }

        frameCount++;
        const now = performance.now();
        if (now - lastTimestamp >= 1000) {
            fps = frameCount;
            frameCount = 0;
            lastTimestamp = now;
            fpsCountEl.innerText = fps;
        }

        // ضبط حجم الكانفس
        if (canvas.width !== videoElement.videoWidth) {
            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;
        }

        const predictions = await model.detect(videoElement);
        drawDetections(predictions);
        updateStats(predictions);
        
        requestAnimationFrame(detectFrame);
    }

    // ==========================================
    // رسم الاكتشافات
    // ==========================================
    function drawDetections(predictions) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
        
        predictions.forEach(prediction => {
            const [x, y, width, height] = prediction.bbox;
            const className = prediction.class;
            const confidence = (prediction.score * 100).toFixed(1);
            
            let color = '#00ff00';
            if (className === 'car') color = '#00b4d8';
            else if (className === 'truck') color = '#ff6d00';
            else if (className === 'bus') color = '#ffab40';
            else if (className === 'motorcycle') color = '#ff3b30';
            else if (className === 'bicycle') color = '#00c853';
            
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, width, height);
            
            ctx.fillStyle = color;
            ctx.font = 'bold 16px Arial';
            const text = `${className} ${confidence}%`;
            const textWidth = ctx.measureText(text).width;
            ctx.fillRect(x, y - 25, textWidth + 10, 25);
            
            ctx.fillStyle = '#fff';
            ctx.fillText(text, x + 5, y - 8);
        });
    }

    // ==========================================
    // تحديث الإحصائيات
    // ==========================================
    function updateStats(predictions) {
        const vehicles = ['car', 'truck', 'bus', 'motorcycle', 'bicycle'];
        let carCount = 0;
        let truckCount = 0;
        let totalVehicles = 0;
        let detectionHtml = '';
        
        predictions.forEach(pred => {
            if (vehicles.includes(pred.class)) {
                totalVehicles++;
                if (pred.class === 'car') carCount++;
                if (pred.class === 'truck') truckCount++;
                
                detectionHtml += `
                    <div class="detection-item">
                        <span class="detection-class">${getVehicleIcon(pred.class)} ${pred.class}</span>
                        <span class="detection-confidence">${(pred.score * 100).toFixed(1)}%</span>
                    </div>
                `;
            }
        });
        
        carCountEl.innerText = carCount;
        truckCountEl.innerText = truckCount;
        totalCountEl.innerText = totalVehicles;
        
        if (detectionHtml === '') {
            detectionListEl.innerHTML = '<div class="loading">🔍 لم يتم اكتشاف أي مركبات</div>';
        } else {
            detectionListEl.innerHTML = `
                <div style="margin-bottom: 10px; color:#00b4d8;">📋 المركبات المكتشفة حالياً:</div>
                ${detectionHtml}
            `;
        }
    }

    function getVehicleIcon(className) {
        const icons = {
            'car': '🚗',
            'truck': '🚛',
            'bus': '🚌',
            'motorcycle': '🏍️',
            'bicycle': '🚲'
        };
        return icons[className] || '🚘';
    }

    // ==========================================
    // رفع فيديو
    // ==========================================
    function uploadVideo() {
        videoInput.click();
    }

    function handleVideoUpload(event) {
        const file = event.target.files[0];
        if (file) {
            if (currentStream) {
                stopDetection();
            }
            resetZoom();
            const url = URL.createObjectURL(file);
            videoElement.srcObject = null;
            videoElement.src = url;
            videoElement.load();
            videoElement.play();
            
            isDetecting = true;
            stopDetectionBtn.disabled = false;
            startCameraBtn.disabled = true;
            uploadVideoBtn.disabled = true;
            switchCameraBtn.disabled = true;
            
            frameCount = 0;
            lastTimestamp = performance.now();
            detectFrame();
        }
    }

    // ==========================================
    // إيقاف الكشف
    // ==========================================
    function stopDetection() {
        isDetecting = false;
        
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
            currentStream = null;
        }
        
        videoElement.srcObject = null;
        videoElement.src = '';
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        stopDetectionBtn.disabled = true;
        startCameraBtn.disabled = false;
        uploadVideoBtn.disabled = false;
        switchCameraBtn.disabled = true;
        cameraSelect.style.display = 'none';
        
        carCountEl.innerText = '0';
        truckCountEl.innerText = '0';
        totalCountEl.innerText = '0';
        fpsCountEl.innerText = '0';
        detectionListEl.innerHTML = '<div class="loading">⏸️ تم إيقاف الكشف</div>';
    }

    // ==========================================
    // ربط الأحداث
    // ==========================================
    startCameraBtn.addEventListener('click', () => startCamera('environment'));
    switchCameraBtn.addEventListener('click', switchCamera);
    uploadVideoBtn.addEventListener('click', uploadVideo);
    stopDetectionBtn.addEventListener('click', stopDetection);
    videoInput.addEventListener('change', handleVideoUpload);
    cameraSelect.addEventListener('change', (e) => {
        if (e.target.value) {
            startSpecificCamera(e.target.value);
        }
    });
    
    zoomInBtn.addEventListener('click', zoomIn);
    zoomOutBtn.addEventListener('click', zoomOut);
    zoomResetBtn.addEventListener('click', resetZoom);
    
    // إضافة أحداث التكبير بالماوس
    const videoContainer = document.getElementById('videoContainer');
    videoContainer.addEventListener('wheel', handleWheelZoom, { passive: false });
    videoContainer.addEventListener('dblclick', handleDoubleClickZoom);
    
    // طلب الأذونات
    async function requestPermissions() {
        try {
            await navigator.mediaDevices.getUserMedia({ video: true });
            await getAvailableCameras();
        } catch (e) {
            console.log('تم رفض الأذونات:', e);
        }
    }
    requestPermissions();
    
    // تحميل النموذج
    loadModel();
</script>
</body>
</html>
