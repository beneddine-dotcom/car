<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>كاشف المركبات - كاميرا فورية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* رأس صغير */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 8px 12px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #00b4d8;
            font-size: 1rem;
        }

        /* إحصائيات مصغرة */
        .stats {
            display: flex;
            gap: 8px;
        }

        .stat {
            background: rgba(0,0,0,0.6);
            border-radius: 20px;
            padding: 4px 10px;
            text-align: center;
        }

        .stat .number {
            font-size: 1rem;
            font-weight: bold;
            color: #00e5ff;
        }

        .stat .label {
            font-size: 0.6rem;
            color: #ccc;
        }

        /* حاوية الكاميرا - تأخذ كل الشاشة */
        .camera-container {
            flex: 1;
            position: relative;
            background: #000;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas {
            pointer-events: none;
        }

        /* أزرار التحكم - تظهر بعد التحميل */
        .controls {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 12px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            z-index: 100;
            transition: all 0.3s ease;
        }

        .controls.hidden {
            transform: translateY(100px);
            opacity: 0;
            pointer-events: none;
        }

        button {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 100px;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff3b30, #d32f2f);
        }

        .zoom-control {
            position: fixed;
            right: 15px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .zoom-control.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .zoom-btn {
            width: 50px;
            height: 50px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #00e5ff;
            cursor: pointer;
            border: 1px solid #00b4d8;
        }

        .zoom-btn:active {
            background: #00b4d8;
            color: white;
        }

        /* شاشة التحميل */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            transition: opacity 0.5s;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #00b4d8;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #00b4d8;
            font-size: 0.9rem;
        }

        /* قائمة الاكتشافات */
        .detection-list {
            position: fixed;
            bottom: 80px;
            left: 15px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 8px 12px;
            max-height: 120px;
            overflow-y: auto;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .detection-list.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .detection-item {
            display: flex;
            justify-content: space-between;
            padding: 5px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 0.8rem;
        }

        .toast {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #00e5ff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            z-index: 150;
            animation: fadeOut 2s ease forwards;
        }

        @keyframes fadeOut {
            0%, 70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>

<!-- شاشة التحميل -->
<div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">⏳ جاري تحميل نموذج الكشف...</div>
    <div class="loading-text" style="font-size:0.7rem; margin-top:10px;">قد يستغرق 5-15 ثانية حسب سرعة الإنترنت</div>
</div>

<!-- الرأس -->
<div class="header">
    <h1>🚗 كاشف المركبات</h1>
    <div class="stats">
        <div class="stat"><div class="number" id="carCount">0</div><div class="label">سيارات</div></div>
        <div class="stat"><div class="number" id="totalCount">0</div><div class="label">الإجمالي</div></div>
        <div class="stat"><div class="number" id="fpsCount">0</div><div class="label">FPS</div></div>
    </div>
</div>

<!-- الكاميرا -->
<div class="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
</div>

<!-- أزرار التكبير -->
<div id="zoomControl" class="zoom-control hidden">
    <div class="zoom-btn" id="zoomInBtn">+</div>
    <div class="zoom-btn" id="zoomOutBtn">−</div>
</div>

<!-- أزرار التحكم الرئيسية -->
<div id="controls" class="controls hidden">
    <button id="startCamBtn" class="btn-success">📷 تشغيل الكاميرا</button>
    <button id="stopCamBtn" class="btn-danger" disabled>⏹️ إيقاف</button>
</div>

<!-- قائمة الاكتشافات -->
<div id="detectionList" class="detection-list hidden">
    <div style="color:#00b4d8; font-size:0.7rem; margin-bottom:5px;">📋 المركبات المكتشفة:</div>
    <div id="detectionItems">—</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<script>
    // ==========================================
    // الإعدادات
    // ==========================================
    let model = null;
    let currentStream = null;
    let isDetecting = false;
    let animationId = null;
    let frameCount = 0;
    let lastTimestamp = 0;
    let fps = 0;
    let frameSkipCounter = 0;
    let lastPredictions = [];
    let currentZoom = 1.0;

    // عناصر DOM
    const videoElement = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const controls = document.getElementById('controls');
    const zoomControl = document.getElementById('zoomControl');
    const detectionList = document.getElementById('detectionList');
    const startCamBtn = document.getElementById('startCamBtn');
    const stopCamBtn = document.getElementById('stopCamBtn');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const carCountEl = document.getElementById('carCount');
    const totalCountEl = document.getElementById('totalCount');
    const fpsCountEl = document.getElementById('fpsCount');
    const detectionItemsEl = document.getElementById('detectionItems');

    // ==========================================
    // إظهار/إخفاء العناصر
    // ==========================================
    function showUI() {
        controls.classList.remove('hidden');
        zoomControl.classList.remove('hidden');
        detectionList.classList.remove('hidden');
    }

    // ==========================================
    // تطبيق التكبير
    // ==========================================
    function applyZoom() {
        if (!videoElement) return;
        const scale = currentZoom;
        const container = document.querySelector('.camera-container');
        if (scale !== 1.0) {
            const translateX = (scale - 1) * 25;
            const translateY = (scale - 1) * 25;
            videoElement.style.transform = `scale(${scale}) translate(${translateX}%, ${translateY}%)`;
            canvas.style.transform = `scale(${scale}) translate(${translateX}%, ${translateY}%)`;
        } else {
            videoElement.style.transform = '';
            canvas.style.transform = '';
        }
    }

    function zoomIn() {
        if (currentZoom < 2.5) {
            currentZoom = Math.min(2.5, currentZoom + 0.2);
            applyZoom();
            showToast(`🔍 ${Math.round(currentZoom * 100)}%`);
        }
    }

    function zoomOut() {
        if (currentZoom > 1.0) {
            currentZoom = Math.max(1.0, currentZoom - 0.2);
            applyZoom();
            showToast(`🔍 ${Math.round(currentZoom * 100)}%`);
        }
    }

    // ==========================================
    // إشعار
    // ==========================================
    function showToast(msg) {
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    // ==========================================
    // تشغيل الكاميرا
    // ==========================================
    async function startCamera() {
        if (!model) {
            showToast('⚠️ النموذج لا يزال يحمّل، انتظر قليلاً');
            return;
        }

        try {
            if (currentStream) {
                stopCamera();
            }

            // طلب الكاميرا الخلفية بدقة منخفضة لسرعة الأداء
            const constraints = {
                video: {
                    facingMode: { exact: 'environment' },
                    width: { ideal: 640 },
                    height: { ideal: 480 },
                    frameRate: { ideal: 24 }
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            } catch (err) {
                // محاولة بدون دقة محددة
                currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            }

            videoElement.srcObject = currentStream;
            await videoElement.play();

            // إعادة ضبط التكبير
            currentZoom = 1.0;
            applyZoom();

            isDetecting = true;
            startCamBtn.disabled = true;
            stopCamBtn.disabled = false;
            frameCount = 0;
            lastTimestamp = performance.now();
            
            // بدء الكشف
            detectFrame();
            
            showToast('✅ الكاميرا تعمل');
            
            // إخفاء شاشة التحميل إذا كانت ظاهرة
            loadingOverlay.classList.add('hidden');
            showUI();

        } catch (error) {
            console.error(error);
            showToast('❌ لا يمكن الوصول إلى الكاميرا');
            startCamBtn.disabled = false;
        }
    }

    // ==========================================
    // إيقاف الكاميرا
    // ==========================================
    function stopCamera() {
        isDetecting = false;
        
        if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
        }
        
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
            currentStream = null;
        }
        
        videoElement.srcObject = null;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        startCamBtn.disabled = false;
        stopCamBtn.disabled = true;
        
        // إعادة ضبط الإحصائيات
        carCountEl.innerText = '0';
        totalCountEl.innerText = '0';
        fpsCountEl.innerText = '0';
        detectionItemsEl.innerHTML = '—';
        
        showToast('⏹️ تم إيقاف الكاميرا');
    }

    // ==========================================
    // كشف الإطارات
    // ==========================================
    async function detectFrame() {
        if (!isDetecting || !videoElement.videoWidth) {
            animationId = requestAnimationFrame(detectFrame);
            return;
        }

        // ضبط حجم canvas
        if (canvas.width !== videoElement.videoWidth) {
            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;
        }

        frameSkipCounter++;
        
        // معالجة كل إطارين لتخفيف الحمل
        if (frameSkipCounter % 2 === 0) {
            frameCount++;
            const now = performance.now();
            if (now - lastTimestamp >= 1000) {
                fps = frameCount * 2;
                frameCount = 0;
                lastTimestamp = now;
                fpsCountEl.innerText = fps;
            }

            try {
                const predictions = await model.detect(videoElement);
                lastPredictions = predictions;
                drawDetections(predictions);
                updateStats(predictions);
            } catch(e) {
                drawVideoOnly();
            }
        } else {
            if (lastPredictions.length > 0) {
                drawDetections(lastPredictions);
            } else {
                drawVideoOnly();
            }
        }
        
        animationId = requestAnimationFrame(detectFrame);
    }

    function drawVideoOnly() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
    }

    function drawDetections(predictions) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
        
        predictions.forEach(pred => {
            if (pred.class !== 'car' && pred.class !== 'truck' && pred.class !== 'bus') return;
            
            const [x, y, w, h] = pred.bbox;
            const confidence = (pred.score * 100).toFixed(0);
            
            let color = '#00b4d8';
            if (pred.class === 'truck') color = '#ff6d00';
            
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, w, h);
            
            ctx.fillStyle = color;
            ctx.font = 'bold 10px Arial';
            const text = `${pred.class} ${confidence}%`;
            ctx.fillRect(x, y - 18, text.length * 12 + 8, 18);
            
            ctx.fillStyle = '#fff';
            ctx.fillText(text, x + 4, y - 6);
        });
    }

    function updateStats(predictions) {
        let carCount = 0;
        let total = 0;
        let html = '';
        
        predictions.forEach(pred => {
            if (pred.class === 'car' || pred.class === 'truck' || pred.class === 'bus') {
                total++;
                if (pred.class === 'car') carCount++;
                
                const icon = pred.class === 'car' ? '🚗' : (pred.class === 'truck' ? '🚛' : '🚌');
                html += `<div class="detection-item">
                            <span>${icon} ${pred.class}</span>
                            <span style="color:#00c853;">${(pred.score * 100).toFixed(0)}%</span>
                         </div>`;
            }
        });
        
        carCountEl.innerText = carCount;
        totalCountEl.innerText = total;
        detectionItemsEl.innerHTML = html || '—';
    }

    // ==========================================
    // تحميل النموذج
    // ==========================================
    async function loadModel() {
        try {
            loadingOverlay.classList.remove('hidden');
            model = await cocoSsd.load();
            loadingOverlay.classList.add('hidden');
            showUI();
            showToast('✅ النموذج جاهز! اضغط "تشغيل الكاميرا"');
        } catch (error) {
            loadingOverlay.innerHTML = `<div style="color:#ff3b30;">❌ خطأ في التحميل<br>${error.message}</div>`;
        }
    }

    // ==========================================
    // ربط الأحداث
    // ==========================================
    startCamBtn.addEventListener('click', startCamera);
    stopCamBtn.addEventListener('click', stopCamera);
    zoomInBtn.addEventListener('click', zoomIn);
    zoomOutBtn.addEventListener('click', zoomOut);

    // بدء التحميل
    loadModel();
</script>
</body>
</html>
