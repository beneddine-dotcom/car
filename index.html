<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>كاشف السيارات - YOLO في المتصفح</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0f2a, #0a1a3a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            max-width: 1000px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(0,180,216,0.3);
        }

        h1 {
            text-align: center;
            color: #00b4d8;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stat-card {
            background: rgba(0,0,0,0.5);
            border-radius: 15px;
            padding: 10px 15px;
            text-align: center;
            border: 1px solid #00b4d8;
            flex: 1;
            min-width: 80px;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00e5ff;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #ccd6f6;
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        video, canvas {
            width: 100%;
            border-radius: 15px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,180,216,0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff3b30, #d32f2f);
        }

        .btn-success {
            background: linear-gradient(135deg, #00c853, #00e676);
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #00b4d8;
        }

        .detection-list {
            background: rgba(0,0,0,0.5);
            border-radius: 15px;
            padding: 15px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }

        .detection-item {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .detection-class {
            color: #00e5ff;
            font-weight: bold;
        }

        .detection-confidence {
            color: #00c853;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a2a4a;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #00b4d8;
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            .stat-number {
                font-size: 1.2rem;
            }
        }

        .camera-select {
            background: rgba(0,0,0,0.5);
            border: 1px solid #00b4d8;
            color: white;
            padding: 8px 12px;
            border-radius: 10px;
            margin-right: 10px;
            font-family: inherit;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🚗 كاشف السيارات والمركبات</h1>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" id="carCount">0</div>
            <div class="stat-label">🚗 سيارات</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="truckCount">0</div>
            <div class="stat-label">🚛 شاحنات</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalCount">0</div>
            <div class="stat-label">📦 الإجمالي</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="fpsCount">0</div>
            <div class="stat-label">⚡ FPS</div>
        </div>
    </div>

    <div class="video-container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
        <select id="cameraSelect" class="camera-select" style="display: none;">
            <option value="">اختر الكاميرا...</option>
        </select>
        <button id="startCamera" class="btn-success">📷 تشغيل الكاميرا الخلفية</button>
        <button id="switchCamera" style="display: none;">🔄 تبديل الكاميرا</button>
        <button id="uploadVideo" class="btn-primary">🎥 رفع فيديو</button>
        <button id="stopDetection" class="btn-danger" disabled>⏹️ إيقاف</button>
        <input type="file" id="videoInput" accept="video/mp4,video/webm" style="display: none;">
    </div>

    <div class="detection-list" id="detectionList">
        <div class="loading">⏳ انتظر تحميل النموذج...</div>
    </div>
</div>

<!-- TensorFlow.js والمكتبات -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<script>
    // المتغيرات العامة
    let model = null;
    let currentStream = null;
    let animationId = null;
    let videoElement = document.getElementById('video');
    let canvas = document.getElementById('canvas');
    let ctx = canvas.getContext('2d');
    let isDetecting = false;
    let lastTimestamp = 0;
    let frameCount = 0;
    let fps = 0;
    let currentFacingMode = 'environment'; // 'environment' = خلفية, 'user' = أمامية

    // عناصر DOM
    const carCountEl = document.getElementById('carCount');
    const truckCountEl = document.getElementById('truckCount');
    const totalCountEl = document.getElementById('totalCount');
    const fpsCountEl = document.getElementById('fpsCount');
    const detectionListEl = document.getElementById('detectionList');
    const startCameraBtn = document.getElementById('startCamera');
    const switchCameraBtn = document.getElementById('switchCamera');
    const uploadVideoBtn = document.getElementById('uploadVideo');
    const stopDetectionBtn = document.getElementById('stopDetection');
    const videoInput = document.getElementById('videoInput');
    const cameraSelect = document.getElementById('cameraSelect');

    // قائمة الكاميرات المتاحة
    let availableCameras = [];

    // ==========================================
    // الحصول على قائمة الكاميرات المتاحة
    // ==========================================
    async function getAvailableCameras() {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(device => device.kind === 'videoinput');
            availableCameras = videoDevices;
            
            if (videoDevices.length > 1) {
                cameraSelect.style.display = 'inline-block';
                switchCameraBtn.style.display = 'inline-block';
                
                cameraSelect.innerHTML = '<option value="">اختر الكاميرا...</option>';
                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.textContent = device.label || `كاميرا ${index + 1}`;
                    cameraSelect.appendChild(option);
                });
            }
            
            return videoDevices;
        } catch (error) {
            console.error('خطأ في الحصول على الكاميرات:', error);
            return [];
        }
    }

    // ==========================================
    // بدء الكاميرا (خلفية أو أمامية)
    // ==========================================
    async function startCamera(facingMode = 'environment') {
        if (!model) {
            alert('الرجاء الانتظار حتى يتم تحميل النموذج');
            return;
        }

        try {
            if (currentStream) {
                stopDetection();
            }

            // إعدادات الكاميرا - البيئة (الخلفية) هي الافتراضية
            const constraints = {
                video: {
                    facingMode: { exact: facingMode }
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            } catch (err) {
                // إذا فشل تحديد الكاميرا بالضبط، حاول بدون تحديد
                console.warn('فشل في تحديد الكاميرا بالضبط، جاري المحاولة بدون تحديد:', err);
                currentStream = await navigator.mediaDevices.getUserMedia({ video: true });
            }
            
            videoElement.srcObject = currentStream;
            await videoElement.play();
            
            // Flip canvas للكاميرا الأمامية إذا لزم الأمر
            if (facingMode === 'user') {
                canvas.style.transform = 'scaleX(-1)';
            } else {
                canvas.style.transform = 'scaleX(1)';
            }
            
            isDetecting = true;
            stopDetectionBtn.disabled = false;
            startCameraBtn.disabled = true;
            uploadVideoBtn.disabled = true;
            switchCameraBtn.disabled = false;
            
            frameCount = 0;
            lastTimestamp = performance.now();
            detectFrame();
            
        } catch (error) {
            console.error('خطأ في الوصول إلى الكاميرا:', error);
            let errorMsg = 'لا يمكن الوصول إلى الكاميرا. ';
            if (error.name === 'OverconstrainedError') {
                errorMsg += 'الكاميرا الخلفية غير متوفرة على هذا الجهاز. حاول استخدام كاميرا أخرى.';
            } else {
                errorMsg += 'تأكد من منح الأذونات.';
            }
            alert(errorMsg);
            
            // محاولة بدء الكاميرا بدون تحديد الاتجاه
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ video: true });
                videoElement.srcObject = currentStream;
                await videoElement.play();
                isDetecting = true;
                stopDetectionBtn.disabled = false;
                startCameraBtn.disabled = true;
                detectFrame();
            } catch (fallbackError) {
                console.error('فشل أيضاً:', fallbackError);
            }
        }
    }

    // ==========================================
    // تبديل بين الكاميرا الأمامية والخلفية
    // ==========================================
    async function switchCamera() {
        if (currentFacingMode === 'environment') {
            currentFacingMode = 'user';
            await startCamera('user');
        } else {
            currentFacingMode = 'environment';
            await startCamera('environment');
        }
    }

    // ==========================================
    // بدء الكاميرا باستخدام كاميرا محددة من القائمة
    // ==========================================
    async function startSpecificCamera(deviceId) {
        if (!model) {
            alert('الرجاء الانتظار حتى يتم تحميل النموذج');
            return;
        }

        try {
            if (currentStream) {
                stopDetection();
            }

            const constraints = {
                video: { deviceId: { exact: deviceId } }
            };

            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            videoElement.srcObject = currentStream;
            await videoElement.play();
            
            isDetecting = true;
            stopDetectionBtn.disabled = false;
            startCameraBtn.disabled = true;
            uploadVideoBtn.disabled = true;
            
            frameCount = 0;
            lastTimestamp = performance.now();
            detectFrame();
            
        } catch (error) {
            console.error('خطأ:', error);
            alert('لا يمكن الوصول إلى الكاميرا المحددة');
        }
    }

    // ==========================================
    // تحميل نموذج COCO-SSD
    // ==========================================
    async function loadModel() {
        detectionListEl.innerHTML = '<div class="loading">📥 جاري تحميل نموذج الكشف... (قد يستغرق 10-20 ثانية)</div>';
        try {
            model = await cocoSsd.load();
            detectionListEl.innerHTML = '<div class="loading">✅ النموذج جاهز! اضغط على "تشغيل الكاميرا الخلفية" أو اختر فيديو</div>';
            console.log('✅ نموذج COCO-SSD تم تحميله بنجاح');
            
            // الحصول على قائمة الكاميرات المتاحة
            await getAvailableCameras();
        } catch (error) {
            detectionListEl.innerHTML = `<div class="loading">❌ خطأ في تحميل النموذج: ${error.message}</div>`;
            console.error('خطأ في تحميل النموذج:', error);
        }
    }

    // ==========================================
    // كشف الإطارات
    // ==========================================
    async function detectFrame() {
        if (!isDetecting || !videoElement.videoWidth) {
            requestAnimationFrame(detectFrame);
            return;
        }

        // حساب FPS
        frameCount++;
        const now = performance.now();
        if (now - lastTimestamp >= 1000) {
            fps = frameCount;
            frameCount = 0;
            lastTimestamp = now;
            fpsCountEl.innerText = fps;
        }

        // ضبط حجم canvas
        if (canvas.width !== videoElement.videoWidth) {
            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;
        }

        // تنفيذ الكشف
        const predictions = await model.detect(videoElement);
        
        // رسم الاكتشافات
        drawDetections(predictions);
        
        // تحديث الإحصائيات
        updateStats(predictions);
        
        // متابعة الكشف
        requestAnimationFrame(detectFrame);
    }

    // ==========================================
    // رسم الاكتشافات على canvas
    // ==========================================
    function drawDetections(predictions) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
        
        predictions.forEach(prediction => {
            const [x, y, width, height] = prediction.bbox;
            const className = prediction.class;
            const confidence = (prediction.score * 100).toFixed(1);
            
            let color = '#00ff00';
            if (className === 'car') color = '#00b4d8';
            else if (className === 'truck') color = '#ff6d00';
            else if (className === 'bus') color = '#ffab40';
            else if (className === 'motorcycle') color = '#ff3b30';
            else if (className === 'bicycle') color = '#00c853';
            
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, width, height);
            
            ctx.fillStyle = color;
            ctx.font = 'bold 16px Arial';
            const text = `${className} ${confidence}%`;
            const textWidth = ctx.measureText(text).width;
            ctx.fillRect(x, y - 25, textWidth + 10, 25);
            
            ctx.fillStyle = '#fff';
            ctx.fillText(text, x + 5, y - 8);
        });
    }

    // ==========================================
    // تحديث الإحصائيات
    // ==========================================
    function updateStats(predictions) {
        const vehicles = ['car', 'truck', 'bus', 'motorcycle', 'bicycle'];
        let carCount = 0;
        let truckCount = 0;
        let totalVehicles = 0;
        let detectionHtml = '';
        
        predictions.forEach(pred => {
            if (vehicles.includes(pred.class)) {
                totalVehicles++;
                if (pred.class === 'car') carCount++;
                if (pred.class === 'truck') truckCount++;
                
                detectionHtml += `
                    <div class="detection-item">
                        <span class="detection-class">${getVehicleIcon(pred.class)} ${pred.class}</span>
                        <span class="detection-confidence">${(pred.score * 100).toFixed(1)}%</span>
                    </div>
                `;
            }
        });
        
        carCountEl.innerText = carCount;
        truckCountEl.innerText = truckCount;
        totalCountEl.innerText = totalVehicles;
        
        if (detectionHtml === '') {
            detectionListEl.innerHTML = '<div class="loading">🔍 لم يتم اكتشاف أي مركبات</div>';
        } else {
            detectionListEl.innerHTML = `
                <div style="margin-bottom: 10px; color:#00b4d8;">📋 المركبات المكتشفة حالياً:</div>
                ${detectionHtml}
            `;
        }
    }

    function getVehicleIcon(className) {
        const icons = {
            'car': '🚗',
            'truck': '🚛',
            'bus': '🚌',
            'motorcycle': '🏍️',
            'bicycle': '🚲'
        };
        return icons[className] || '🚘';
    }

    // ==========================================
    // رفع فيديو من الجهاز
    // ==========================================
    function uploadVideo() {
        videoInput.click();
    }

    function handleVideoUpload(event) {
        const file = event.target.files[0];
        if (file) {
            if (currentStream) {
                stopDetection();
            }
            const url = URL.createObjectURL(file);
            videoElement.srcObject = null;
            videoElement.src = url;
            videoElement.load();
            videoElement.play();
            
            isDetecting = true;
            stopDetectionBtn.disabled = false;
            startCameraBtn.disabled = true;
            uploadVideoBtn.disabled = true;
            switchCameraBtn.disabled = true;
            
            frameCount = 0;
            lastTimestamp = performance.now();
            detectFrame();
        }
    }

    // ==========================================
    // إيقاف الكشف
    // ==========================================
    function stopDetection() {
        isDetecting = false;
        
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
            currentStream = null;
        }
        
        videoElement.srcObject = null;
        videoElement.src = '';
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        stopDetectionBtn.disabled = true;
        startCameraBtn.disabled = false;
        uploadVideoBtn.disabled = false;
        switchCameraBtn.disabled = true;
        cameraSelect.style.display = 'none';
        
        carCountEl.innerText = '0';
        truckCountEl.innerText = '0';
        totalCountEl.innerText = '0';
        fpsCountEl.innerText = '0';
        detectionListEl.innerHTML = '<div class="loading">⏸️ تم إيقاف الكشف</div>';
    }

    // ==========================================
    // ربط الأحداث
    // ==========================================
    startCameraBtn.addEventListener('click', () => startCamera('environment'));
    switchCameraBtn.addEventListener('click', switchCamera);
    uploadVideoBtn.addEventListener('click', uploadVideo);
    stopDetectionBtn.addEventListener('click', stopDetection);
    videoInput.addEventListener('change', handleVideoUpload);
    cameraSelect.addEventListener('change', (e) => {
        if (e.target.value) {
            startSpecificCamera(e.target.value);
        }
    });

    // طلب أذونات الكاميرا مسبقاً للحصول على أسماء الأجهزة
    async function requestPermissions() {
        try {
            await navigator.mediaDevices.getUserMedia({ video: true });
            await getAvailableCameras();
        } catch (e) {
            console.log('تم رفض الأذونات أو الخطأ:', e);
        }
    }
    requestPermissions();

    // تحميل النموذج عند بدء الصفحة
    loadModel();
</script>
</body>
</html>
